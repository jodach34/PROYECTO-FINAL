# =============================================================================
# Despliegue en Render - PLAN GRATUITO (dos servicios Docker).
#
# IMPORTANTE AL CREAR EL BLUEPRINT EN RENDER:
#   selecciona la rama  fix/render-produccion-p0  en el asistente de Render.
#   Si se deja la rama por defecto (main), Render lee el render.yaml viejo, que
#   pide un disco persistente y un plan de pago.
#
# POR QUE SON DOS SERVICIOS
# El proyecto tiene una API (habla con SQLite) y un MVC (la consume por HTTP).
# Render ejecuta un proceso por servicio web, asi que hacen falta los dos:
#
#   rescauta-api -> Dockerfile       -> /health y /api/v1/..., crea el esquema al arrancar
#   rescauta-mvc -> Dockerfile.mvc   -> pagina publica, /healthz, habla con la API
#
# POR QUE ESTO FUNCIONA EN FREE
#   * Ningun servicio usa disco persistente (el plan free no los permite).
#   * SQLite vive en /app/data/rescauta.db, una ruta escribible del contenedor.
#     Es EFIMERA: los datos se pierden al redesplegar o reiniciar el servicio.
#     Al arrancar de nuevo, la API recrea el esquema y la cuenta administradora.
#   * Cada Dockerfile expande ${PORT} al arrancar, que es el puerto que asigna Render.
#
# URLS PUBLICAS
# Los nombres de servicio de este archivo producen estos hostnames:
#   https://rescauta-api.onrender.com
#   https://rescauta-mvc.onrender.com
# Si Render te obliga a usar otro nombre (porque el hostname ya existe), cambia
# tambien las tres URLs de abajo.
#
# SECRETOS QUE RENDER PIDE AL CREAR EL BLUEPRINT (sync: false)
#   Auth__SeedAdminEmail / Auth__SeedAdminPassword -> OBLIGATORIOS. Sin ellos, si
#     no existe ningun administrador, la API no arranca (fail-fast a proposito).
#     La contrasena debe tener al menos 8 caracteres e incluir una letra y un numero.
#   Gemini__ApiKey, Qdrant__Url, Qdrant__ApiKey -> OPCIONALES. Sin ellos la app,
#     el login, las donaciones y el inventario funcionan; el chatbot responde 503
#     hasta que se configuren. Se pueden dejar vacios y rellenar despues en el
#     panel de Render (Environment).
#
# Internal__ApiKey NO se pide a mano: se genera en la API y el MVC la copia con
# fromService. Debe existir en ambos y el MVC no arranca en produccion sin ella.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Servicio 1: la API. Es la unica que habla con la base de datos.
  # ---------------------------------------------------------------------------
  - type: web
    name: rescauta-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # /health comprueba la base y las tablas esenciales. La API crea el esquema
    # antes de abrir el puerto, asi que cuando Render empieza a preguntar ya esta.
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Sqlite
      # Ruta escribible del contenedor. Sin disco persistente: es efimera.
      # Si se cambia esta ruta, Dockerfile y docker-entrypoint.sh usan /app/data.
      - key: Database__ConnectionString
        value: Data Source=/app/data/rescauta.db
      - key: Database__MigrateOnStartup
        value: "true"
      # URL publica del MVC que abre el QR de seguimiento.
      - key: Qr__SeguimientoBaseUrl
        value: https://rescauta-mvc.onrender.com/Seguimiento
      # URL publica del MVC para el enlace de recuperacion de contrasena.
      - key: Auth__ResetPasswordUrl
        value: https://rescauta-mvc.onrender.com/Cuenta/RestablecerPassword
      # Primera cuenta administradora. Render pide ambos valores; no se guardan aqui.
      - key: Auth__SeedAdminEmail
        sync: false
      - key: Auth__SeedAdminPassword
        sync: false
      # Secreto compartido con rescauta-mvc. Se genera una vez y el MVC lo copia.
      - key: Internal__ApiKey
        generateValue: true
      # Chatbot (opcionales). Vacio = 503 controlado, no tumba el resto de la app.
      - key: Gemini__ApiKey
        sync: false
      - key: Qdrant__Url
        sync: false
      - key: Qdrant__ApiKey
        sync: false

  # ---------------------------------------------------------------------------
  # Servicio 2: el MVC. Es la pagina que se abre. No tiene base de datos propia.
  # ---------------------------------------------------------------------------
  - type: web
    name: rescauta-mvc
    runtime: docker
    dockerfilePath: ./Dockerfile.mvc
    dockerContext: .
    plan: free
    # /healthz no llama a la API: evita que el cold start de la API tumbe el
    # health check del MVC y provoque reinicios en bucle.
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # URL publica de la API, con https y barra final. Sin esto el MVC no arranca.
      - key: Api__BaseUrl
        value: https://rescauta-api.onrender.com/
      # Mismo valor que la API. Render lo copia automaticamente.
      - key: Internal__ApiKey
        fromService:
          type: web
          name: rescauta-api
          envVarKey: Internal__ApiKey
